name: Deploy Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-studio.yml'
      - 'packages/studio/**'
      - 'packages/shared-types/**'
      # Bundled `workspace:*` dependency — same reason as
      # `deploy-frontends.yml`, where omitting it meant an SDK-only fix did not
      # deploy and had to be dispatched by hand.
      - 'packages/sdk/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  deploy-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build shared types
        run: bun run build:shared-types
      # Gates run before the build so a failure is reported in seconds rather than after
      # a 60-minute bundle. Both depend on shared-types being built above.
      # NOTE: the studio runner is jest (`jest --watchAll=false`), NOT `bun test` —
      # the two are not interchangeable and running the wrong one reports false failures.
      - name: Test studio
        run: cd packages/studio && bun run test
      - name: Typecheck studio
        run: cd packages/studio && bun run typecheck
      - name: Build studio
        run: bun run build:studio
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Same Oxy application as the main app — studio is a surface of Syra,
          # not a separate client. `config.ts` falls back to the development id
          # when unset, so a local build works unconfigured; without this the
          # production bundle would silently ship the dev client. A repo
          # VARIABLE, not a secret: the id ships inside the bundle, so it is
          # public by construction and a secret would only hide it from the UI.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
      # wrangler-action needs to know which wrangler to run, and the repo already
      # says: `packages/frontend` declares it and bun hoists that ONE copy, which
      # every job here resolves. Restating the version in the workflow made it a
      # second declaration of one fact, and the two drifted — the manifest moved
      # to 3.114.17 while this pin stayed at 3.114.0, so the action found the
      # newer wrangler already installed, judged it incompatible, and tried to
      # install the older one over it:
      #
      #     bun i wrangler@3.114.0
      #     error: Fail extracting tarball for "wrangler"
      #
      # Read it instead. `jq -e` fails the job if the key ever moves, which is
      # the loud failure a silent mismatch did not give us.
      - name: Read the declared wrangler version
        id: wrangler
        run: |
          version="$(jq -er '.devDependencies.wrangler' packages/frontend/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: pages deploy packages/studio/dist --project-name=syra-studio --branch=main
