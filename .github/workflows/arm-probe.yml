# Temporary diagnostic: does an ARM runner start AT ALL in this repository?
#
# `Deploy to AWS` (the only Syra workflow on `ubuntu-24.04-arm`) has concluded
# `action_required` with ZERO jobs on every push since 2026-08-01, while every
# `ubuntu-latest` workflow in the same push runs normally. Three sibling repos
# (Alia, Allo, Mercaria) use the same runner label and deploy fine, so the label
# itself is not unavailable org-wide.
#
# This does nothing but claim an ARM runner and echo. If it also concludes
# `action_required`, the block is the runner in THIS repository; if it runs, the
# block is something in deploy-aws.yml. Delete once the answer is known.
name: ARM probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: uname -m
      # Second question: the first probe used no actions at all and started
      # fine. deploy-aws.yml uses several. If an org policy restricts which
      # actions may run, a workflow referencing a disallowed one is blocked
      # before any job starts — which is exactly the shape we are chasing.
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true
