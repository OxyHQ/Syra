name: Apply listener source checkpoint
on:
  push:
    branches: [feat/listener-experience-140-implementation]
    paths: [.review/listener.patch]
permissions:
  contents: write
concurrency:
  group: listener-source-checkpoint
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply source checkpoint
        shell: python
        run: |
          import base64, gzip, io, pathlib, subprocess, tempfile
          envelope = pathlib.Path('.review/listener.patch')
          if envelope.stat().st_size > 2_000_000:
            raise SystemExit('Checkpoint exceeds size limit')
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(envelope.read_text().strip(), validate=True))) as compressed:
            data = compressed.read(2_000_001)
          if len(data) > 2_000_000:
            raise SystemExit('Decoded patch exceeds size limit')
          with tempfile.NamedTemporaryFile(suffix='.patch') as patch:
            patch.write(data)
            patch.flush()
            stats = subprocess.check_output(['git', 'apply', '--numstat', patch.name], text=True)
            paths = [entry.split('\t', 2)[2] for entry in stats.splitlines()]
            for path in paths:
              parts = pathlib.PurePosixPath(path).parts
              allowed = path.startswith(('packages/', 'docs/', 'functions/', 'patches/', 'scripts/')) or path in ('package.json', 'bun.lock')
              if not allowed or '..' in parts or 'node_modules' in parts or '.git' in parts or pathlib.PurePosixPath(path).name == '.env':
                raise SystemExit('Disallowed source path: ' + path)
            subprocess.run(['git', 'apply', '--check', patch.name], check=True)
            subprocess.run(['git', 'apply', patch.name], check=True)
          envelope.unlink()
          subprocess.run(['git', 'add', '--', *paths, str(envelope)], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Checkpoint listener experience implementation'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/listener-experience-140-implementation'], check=True)
      - name: Archive committed source
        if: always()
        run: git archive --format=tar --output=source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listener-checkpoint-source
          path: source.tar
          retention-days: 1
