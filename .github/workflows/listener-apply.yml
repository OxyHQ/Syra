name: Apply listener implementation checkpoint
on:
  push:
    branches: [feat/listener-experience-140-implementation]
    paths: [.github/listener-change.patch]
permissions:
  contents: write
concurrency:
  group: listener-implementation-checkpoint
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/listener-experience-140-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply the source checkpoint to this branch only
        shell: python
        run: |
          import base64
          import gzip
          import json
          import pathlib
          import re
          import shutil
          import subprocess

          def validate_path(name):
              path = pathlib.PurePosixPath(name)
              allowed = name.startswith(('packages/', 'docs/', 'patches/')) or name in ('package.json', 'bun.lock')
              if not allowed or path.is_absolute() or '..' in path.parts:
                  raise RuntimeError(f'Unexpected checkpoint path: {name}')
              if pathlib.Path(name).is_symlink():
                  raise RuntimeError('Refusing a symlink target')
              return pathlib.Path(name)

          payload = pathlib.Path('.github/listener-change.patch')
          text = payload.read_text()
          if text.startswith('X-Syra-Gzip\n'):
              encoded = ''.join(text.splitlines()[1:])
              if len(encoded) > 2000000:
                  raise RuntimeError('Oversized checkpoint')
              text = gzip.decompress(base64.b64decode(encoded, validate=True)).decode('utf-8')
              payload.write_text(text)
          targets = set()
          if text.startswith('X-Syra-Json\n'):
              change = json.loads(text.split('\n', 1)[1])
              subject = change['subject']
              prepared = {}
              for name, edit in change.get('files', {}).items():
                  path = validate_path(name)
                  if 'content' in edit:
                      if path.exists():
                          raise RuntimeError(f'New file already exists: {name}')
                      content = edit['content']
                  else:
                      content = path.read_text()
                      for replacement in edit['replacements']:
                          old, new = replacement['old'], replacement['new']
                          if content.count(old) != replacement.get('count', 1):
                              raise RuntimeError(f'Expected replacement was not unique: {name}: {old[:100]}')
                          content = content.replace(old, new)
                  prepared[name] = content
              for namespace, translations in change.get('locales', {}).items():
                  for path in pathlib.Path('packages/frontend/locales').glob('*.json'):
                      name = str(path)
                      data = json.loads(prepared.get(name, path.read_text()))
                      data[namespace] = {**data.get(namespace, {}), **translations['en'], **translations.get(path.stem, {})}
                      prepared[name] = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
              for name, content in prepared.items():
                  path = validate_path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
                  targets.add(name)
          else:
              paths = re.findall(r'^diff --git a/(\S+) b/(\S+)$', text, re.MULTILINE)
              for before, after in paths:
                  if before != after:
                      raise RuntimeError('Renames are not supported by this checkpoint')
                  validate_path(after)
                  targets.add(after)
              for source, target in re.findall(r'^X-Syra-Copy: (\S+) => (\S+)$', text, re.MULTILINE):
                  validate_path(source)
                  if target not in targets or not source.startswith('packages/backend/drizzle/meta/') or pathlib.Path(target).exists():
                      raise RuntimeError('Unexpected migration snapshot copy')
                  shutil.copyfile(source, target)
              subprocess.run(['git', 'apply', '--check', str(payload)], check=True)
              subprocess.run(['git', 'apply', str(payload)], check=True)
              match = re.search(r'^X-Syra-Subject: ([^\n]+)$', text, re.MULTILINE)
              if not match:
                  raise RuntimeError('Missing checkpoint commit subject')
              subject = match.group(1)
          if not targets or not isinstance(subject, str) or not subject.strip() or len(subject) > 200:
              raise RuntimeError('Empty or invalid checkpoint')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(targets)], check=True)
          subprocess.run(['git', 'rm', '-f', '--', str(payload)], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', subject], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/listener-experience-140-implementation'], check=True)
          subprocess.run(['git', 'archive', '--format=tar', '--output=syra-checkpoint.tar', 'HEAD'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: syra-implementation-checkpoint
          path: syra-checkpoint.tar
          retention-days: 1
