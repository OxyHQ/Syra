name: Deploy Frontends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-frontends.yml'
      - 'packages/frontend/**'
      - 'packages/shared-types/**'
      # `@syra.fm/sdk` is a `workspace:*` dependency the app BUNDLES, so a change
      # to it ships inside this deploy — but it was missing here, and the gap is
      # not theoretical: the PostgreSQL migration's wire-contract change made
      # `id` required on `ZRoom` while `validateRooms` DROPS what it cannot
      # parse, so an SDK-only fix had to be dispatched by hand while the Live
      # screen sat empty in production. A path filter that omits a bundled
      # workspace package does not fail — it silently does not deploy.
      - 'packages/sdk/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build shared types
        run: bun run build:shared-types
      # Gates run before the build so a failure is reported in seconds rather than after
      # a 60-minute bundle. Both depend on shared-types being built above.
      # NOTE: the frontend runner is jest (`jest --watchAll=false`), NOT `bun test` —
      # the two are not interchangeable and running the wrong one reports false failures.
      - name: Test frontend
        run: cd packages/frontend && bun run test
      - name: Typecheck frontend
        run: cd packages/frontend && bun run typecheck
      # i18n key integrity. tsc cannot see this: i18next renders the raw key when it
      # cannot resolve one, so a renamed key ships as dotted identifiers on screen in
      # every language rather than failing anything.
      - name: Check i18n keys
        run: cd packages/frontend && bun run check-i18n
      - name: Build frontend
        run: bun run build:frontend
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Syra's PRODUCTION Oxy client id. `config.ts` falls back to the
          # development id when this is unset, so a local build still works —
          # which is exactly why it has to be injected here: without it the
          # production bundle silently ships the dev client and every sign-in
          # authenticates against the wrong application. A repo VARIABLE, not a
          # secret: the id travels inside the bundle, so it is public by
          # construction, and a secret would only make it unreadable in the UI —
          # costing the ability to check what production uses without deploying.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
      # wrangler-action needs to know which wrangler to run, and the repo already
      # says: `packages/frontend` declares it and bun hoists that ONE copy, which
      # every job here resolves. Restating the version in the workflow made it a
      # second declaration of one fact, and the two drifted — the manifest moved
      # to 3.114.17 while this pin stayed at 3.114.0, so the action found the
      # newer wrangler already installed, judged it incompatible, and tried to
      # install the older one over it:
      #
      #     bun i wrangler@3.114.0
      #     error: Fail extracting tarball for "wrangler"
      #
      # Read it instead. `jq -e` fails the job if the key ever moves, which is
      # the loud failure a silent mismatch did not give us.
      - name: Read the declared wrangler version
        id: wrangler
        run: |
          version="$(jq -er '.devDependencies.wrangler' packages/frontend/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: pages deploy packages/frontend/dist --project-name=syra --branch=main
