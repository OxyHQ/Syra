# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute syra (ecs service + ecr repo name) and packages/backend/Dockerfile (path).
name: Deploy to AWS

on:
  # After Quality passes on a push to main, never alongside it. Until 2026-10
  # this ran on `push` with a `test` job of its own that repeated what Quality
  # already runs on that push (install, builds, typecheck, migrate, the backend
  # and frontend suites, i18n), holding a second runner for the copy while
  # Quality ran in parallel. Quality on push to main runs every job (its
  # `changes` filter only narrows pull requests), so the gate is now the whole
  # of Quality for the exact commit released. The `scope` job below owns the
  # guards and the path scope `push` used to give.
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  # Releases main's head on demand, and still only once Quality succeeded on a
  # push for it (`deploy-scope.sh gate` checks that, once, and refuses
  # otherwise).
  workflow_dispatch:
    inputs:
      migration_phase:
        description: >-
          How to apply migrations. `pre-post` (default) applies the additive ones
          before the rollout and the deferred ones after. `all` applies the whole
          journal in ONE run before the rollout — what the genesis cutover needs,
          and wrong for anything else. See the migration steps below.
        type: choice
        default: pre-post
        options:
          - pre-post
          - all

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: syra
  CLUSTER: oxy-cluster
  # The commit under release: the one Quality tested on `workflow_run`, main's
  # head on a dispatch. Not `github.sha`, which on `workflow_run` is whatever
  # main's head was when Quality finished. Not named DEPLOY_SHA:
  # deploy-ecs-image.sh reads that name to arm a head guard script this
  # repository does not carry.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Decides, OUTSIDE the release lane, whether `deploy` runs at all: the
  # trigger guards, which commit to release, and the path scope. See
  # .github/scripts/deploy-scope.sh for why each is needed once the trigger is
  # `workflow_run`. It must sit outside the concurrency group: GitHub cancels a
  # PENDING run when another queues behind it in the same group, so a run for
  # an older commit whose Quality finished late could displace a pending
  # release of a newer one and then hold itself, leaving neither deployed.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level: no OIDC token here, and `actions: read` (Quality's runs, the
    # release marker) reaches no other job.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release only the newest Quality-green main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      # What goes into the backend image or its rollout, diffed against the
      # last commit this workflow actually released, so a frontend- or
      # studio-only merge (deploy-frontends.yml / deploy-studio.yml ship those)
      # does not roll the API. packages/backend/Dockerfile copies the root
      # manifests, every workspace package.json, shared-types, the SDK and the
      # backend; `.dockerignore` files and the release scripts change what is
      # built or how it rolls out. test-deploy-scope.sh reads this line.
      - name: Decide whether anything the backend ships changed
        id: backend
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_PATHS: '^(packages/(backend|shared-types|sdk)/|packages/[^/]+/package\.json$|package\.json$|bun\.lock$|bunfig\.toml$|tsconfig\.json$|\.github/workflows/deploy-aws\.yml$|\.github/scripts/)|\.dockerignore$'
        run: bash .github/scripts/deploy-scope.sh target backend include "$BACKEND_PATHS" syra-release-backend-

  deploy:
    needs: scope
    # `scope` admits only a commit Quality passed on a push to main in this
    # repository, the newest such commit, with something backend to release.
    # The ref check stays as well: only the protected main branch may assume
    # the AWS deploy role.
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.backend == 'true'
    # On the JOB, not the workflow, so only a run `scope` judged releasable
    # ever enters the lane.
    #
    # Serialize production rollouts. Two overlapping runs each register a task
    # definition revision and then call update-service; interleaved, the older
    # image wins and the newer run still reports success. Never cancel in
    # progress: an interrupted run leaves an unmonitored rollout in ECS. A newer
    # pending run may replace an older pending one, which is safe: its scope
    # diffs from the last commit actually released, so it carries the older.
    # run-backend-script.yml shares this group deliberately.
    concurrency:
      group: deploy-syra-backend
      cancel-in-progress: false
    # The image build, then the pre-migration task, the rollout and the
    # post-migration task, each bounded by deploy-ecs-image.sh's MAX_WAIT_SECS
    # (20 min), plus a rollback window; recent runs took 15-35 min end to end.
    # Without a bound a hung step holds a runner for GitHub's 6-hour default.
    timeout-minutes: 120
    # ARM, so buildx builds the linux/arm64 image NATIVELY. Do not "fix" this by
    # moving to x86 + `docker/setup-qemu-action`: emulated arm64 builds are far
    # slower, and the outage that change was meant to answer had a different
    # cause entirely.
    #
    # THE STORY THAT SAYS OTHERWISE IS WRONG, and it is written down here so it
    # is not re-derived. Through 2026-08-08 every run of this workflow completed
    # as `action_required` with ZERO jobs, which was attributed to this
    # partner-runner label. It is not the label. GitHub's run page states the
    # actual reason: "GitHub detected that this workflow file may be malicious.
    # It will not run until someone with write access approves it." Two
    # measurements settle it — a dispatch of THIS workflow with both jobs on
    # `ubuntu-latest` was blocked identically (run 31278743099, zero jobs), and
    # Mercaria's first green deploy (run 31275312983) was created at 19:47:43Z,
    # started at 20:05:05Z once approved, and ran its deploy job on THIS LABEL,
    # three minutes before the commit that moved it to QEMU. The label works; the
    # run needs a human to approve it.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets are NOT in GitHub. SSM Parameter Store (/oxy/syra/*,
      # SecureString) is their single source of truth: the task definition reads
      # them at task start, and nothing in this workflow writes one. Setting or
      # rotating a value is `aws ssm put-parameter --overwrite` by its owner
      # (oxy-infra docs/runbooks/46-app-secrets-in-ssm.md), never a repo secret.
      # Until 2026-10-10 a step here copied GitHub repo secrets into SSM on every
      # deploy; that made GitHub the source of truth for production credentials
      # and is gone. `src/db/__tests__/deployWorkflow.test.ts` fails if a step
      # writes SSM or reads an app secret from GitHub again.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps. Without them buildx skips the cache without a word: the deploy of
      # run 36506244300 built every layer from scratch (zero CACHED steps,
      # including the Bento4 cmake build and every apk layer), and the repo holds
      # no buildkit cache entry at all. Clarity, which builds through
      # docker/build-push-action (it exports these itself), shows 22 CACHED steps.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # Production builds only what the owner reviewed. The Dockerfile, its
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile path,
      # context and the label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. CI runs the same
      # check on every pull request (`reviewed-image.py check`, in `quality`),
      # so a change that would stop here fails before it can merge.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe syra

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ env.RELEASE_SHA }}
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # --metadata-file is the only addition to this build: the digest comes
          # out of the build itself. Resolving it afterwards with
          # `aws ecr describe-images` is not an option here: oxy-github-deploy
          # has no ecr:DescribeImages, confirmed with
          # `aws iam simulate-principal-policy` (implicitDeny), so that call
          # fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "$CONTEXT"

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      # ── Which migrations bracket this rollout ────────────────────────────────
      #
      # Exactly one of the next two steps runs — their conditions are
      # complements of the same expression — and each writes the pair of one-shot
      # commands `deploy-ecs-image.sh` consumes into $GITHUB_ENV. That is what
      # makes `all` and `post` mutually exclusive: not a convention, but the fact
      # that no run can execute both selectors, so no run can produce both
      # commands. `src/db/__tests__/deployWorkflow.test.ts` reads this file and
      # fails if the conditions stop being complements.
      #
      # `bun`: the runtime packages/backend/Dockerfile's runner stage ships
      # (oven/bun:1.4.3-alpine). The one-shots run on the revision this deploy
      # registers, i.e. on the image just built, so the command and the image
      # always change together; reverting to a Node image reverts these too.
      # `dist/src/db/migrate.js`: tsconfig sets `rootDir: "./"`, so `src/` is
      # preserved inside `dist/`.
      # `--target-database=syra`: the migrator refuses to run without it, because
      # a migration aimed at the wrong database does not fail — it reports
      # success over an untouched one.

      # THE CUTOVER, chosen by hand from workflow_dispatch, and never the
      # default. THE FIRST PRODUCTION DEPLOY CANNOT USE `--phase=pre`. Measured
      # against the journal as it stands: `pre` and `post` both BLOCK, because
      # migration 0003 (`pre`) sits behind 0001 (`post`) and the ledger cannot
      # express a hole. That is the genesis window — those migrations only ever
      # ran against an empty database with no live predecessor to protect — and
      # `--phase=all` is the correct and only sanctioned way to apply it. See
      # src/db/migrate.ts, "THE GENESIS BOOTSTRAP WINDOW".
      #
      # The post-deploy command is deliberately EMPTY, which is how
      # deploy-ecs-image.sh is told to skip that task: the `all` run above it has
      # already applied everything, so a `post` task could only find nothing
      # pending and add a way for a green cutover to end on a red step.
      - name: Select migrations (cutover — the whole journal, before the rollout)
        if: github.event.inputs.migration_phase == 'all'
        run: |
          {
            echo 'PRE_DEPLOY_TASK_COMMAND_JSON=["bun","packages/backend/dist/src/db/migrate.js","--phase=all","--target-database=syra"]'
            echo 'POST_DEPLOY_TASK_COMMAND_JSON='
          } >>"$GITHUB_ENV"

      # Every ordinary release. `pre` runs while the PREVIOUS image is still
      # serving and applies only additive migrations; `post` runs once the new
      # image is live and applies what `pre` deferred. src/db/migrate.ts explains
      # the marker each migration carries and why there is no default phase.
      - name: Select migrations (default — additive before, deferred after)
        if: github.event.inputs.migration_phase != 'all'
        run: |
          {
            echo 'PRE_DEPLOY_TASK_COMMAND_JSON=["bun","packages/backend/dist/src/db/migrate.js","--phase=pre","--target-database=syra"]'
            echo 'POST_DEPLOY_TASK_COMMAND_JSON=["bun","packages/backend/dist/src/db/migrate.js","--phase=post","--target-database=syra"]'
          } >>"$GITHUB_ENV"

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}

          # DATABASE_URL is injected into every revision this deploy registers.
          #
          # It cannot come from Terraform. `modules/app-service` in oxy-infra
          # sets `ignore_changes = [task_definition]` on the ECS service, and
          # deploy-ecs-image.sh derives each new revision from the revision
          # currently RUNNING — so a `secrets` entry added to `module "syra"`
          # lands in a revision nothing runs and nothing inherits, indefinitely
          # and with no error. The entry is still there (it declares intent, and
          # a from-scratch apply needs it); THIS is what puts the value in front
          # of the service. Same mechanism Mention uses for its own
          # deploy-injected secrets.
          #
          # It is also what gives the one-shot migration tasks this step runs
          # their connection string: each runs as a container override on the
          # revision this deploy registers, so they see exactly these secrets.
          #
          # The parameter must EXIST before the first task launches from a
          # revision naming it, or the task dies with
          # `ResourceInitializationError: unable to pull secrets or registry
          # auth` — at task launch, not at deploy. Nothing in this workflow
          # creates one: a new entry here is preceded by its owner writing
          # /oxy/syra/<NAME> with `aws ssm put-parameter` (oxy-infra runbook 46).
          TASK_SECRET_OVERRIDES_JSON: '{"DATABASE_URL":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/syra/DATABASE_URL","INGEST_TOKEN_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/syra/INGEST_TOKEN_SECRET"}'

          # The Oxy service credential Syra no longer holds.
          #
          # NOT SETTING SOMETHING HERE REMOVES NOTHING. Every release renders
          # from the task definition the service is RUNNING, so a secret that was
          # put on a revision by hand or by Terraform stays on every future
          # revision until a deploy is told to take it out. This list is that
          # instruction, and it is the only thing that retires
          # OXY_SERVICE_API_KEY and OXY_SERVICE_API_SECRET from the container —
          # Syra attests its ECS task role for an Oxy service token now (oxy ADR
          # 0026), and @oxy.so/core >= 1.6.1 takes that path whenever no pair is
          # present. `src/oxyClient.ts` asks whether this process can
          # authenticate rather than whether the two variables are set, so the
          # notifier keeps minting across the change.
          #
          # The SSM parameters are untouched and still exist. This removes the
          # task definition's REFERENCE to them, which is the half a deploy owns;
          # retiring the parameters is a separate, later, irreversible step.
          TASK_SECRET_REMOVALS: OXY_SERVICE_API_KEY OXY_SERVICE_API_SECRET

          # PRE_DEPLOY_TASK_COMMAND_JSON / POST_DEPLOY_TASK_COMMAND_JSON are NOT
          # set here: whichever selector step above ran put them in $GITHUB_ENV,
          # so the pair this step sees is the one the chosen `migration_phase`
          # produced. The script reads an empty POST value as "no post task".
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh

      # The scope job's base for the next release: the last commit this
      # workflow actually rolled out, as an Actions cache key (its content is
      # irrelevant). Only a successful rollout reaches this step, and it runs on
      # main only, so no pull request can move it. Lost or evicted, the next run
      # releases.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: syra-release-backend-${{ env.RELEASE_SHA }}
