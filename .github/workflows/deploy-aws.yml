# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute syra (ecs service + ecr repo name) and packages/backend/Dockerfile (path).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      migration_phase:
        description: >-
          How to apply migrations. `pre-post` (default) applies the additive ones
          before the rollout and the deferred ones after. `all` applies the whole
          journal in ONE run before the rollout — what the genesis cutover needs,
          and wrong for anything else. See the migration steps below.
        type: choice
        default: pre-post
        options:
          - pre-post
          - all

permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize production rollouts. Two overlapping runs each register a task
  # definition revision and then call update-service; interleaved, the older
  # image wins and the newer run still reports success. Never cancel in
  # progress: an interrupted run leaves an unmonitored rollout in ECS.
  group: deploy-syra-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: syra
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile

jobs:
  test:
    # x86, matching `quality.yml`'s job rather than the `deploy` job below. This
    # job now runs the SAME Postgres service container quality.yml runs, and the
    # two are compared field-by-field by
    # `src/db/__tests__/deployWorkflow.test.ts`; running them on the same
    # architecture is part of keeping that comparison meaningful. Nothing here is
    # architecture-sensitive anyway — it typechecks, migrates and runs test
    # suites. Only `deploy` needs ARM, to build the arm64 image natively.
    #
    # NOT a workaround for the runner-label outage story: that theory was tested
    # and is FALSE. See the note on `deploy`'s `runs-on` before changing either.
    runs-on: ubuntu-latest

    # `postgres:17`, not a PostGIS image — the same image `quality.yml` and
    # `docker-compose.postgres.yml` pin, on the same version. `src/db/extensions.ts`
    # keeps `REQUIRED_EXTENSIONS` deliberately EMPTY: Syra has no `2dsphere` index
    # and no geospatial query to port. Keep this bare, and keep all three in
    # agreement — a schema task that starts needing an extension adds it to
    # `REQUIRED_EXTENSIONS` first, and only then to every image that serves a
    # database this suite runs against.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syra
          POSTGRES_PASSWORD: syra
          POSTGRES_DB: syra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syra -d syra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The backend suite is Postgres-backed: 92 of its files reach
    # `src/test/postgres.ts`, whose `beforeAll` throws
    # `TEST_DATABASE_URL (or DATABASE_URL) must point at a migrated Postgres.`
    # when this is unset. Without it every deploy fails in its first job, on a
    # missing environment variable rather than a bad assertion.
    env:
      TEST_DATABASE_URL: postgres://syra:syra@127.0.0.1:5432/syra_ci

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build:shared-types

      # The backend imports @syra.fm/sdk (workspace); build its dist so tsc/tests resolve it.
      - run: bun run build:sdk

      # Typecheck before tests: it is faster and covers strictly more files. It runs
      # against tsconfig.json (NOT tsconfig.build.json), because the build config
      # excludes **/*.test.ts — and test files are exactly where type errors hide when
      # nothing checks them. Depends on the shared-types/sdk dists built above.
      - run: cd packages/backend && bun run typecheck

      # The upload screening suite shells out to real binaries: ffprobe for a
      # fixture's true duration/codec, ffmpeg to build fixtures and drive the HLS
      # packager, fpcalc for the Chromaprint fingerprints the dedup tiers match on.
      # Without them 43 tests fail in under a millisecond each — a missing
      # executable, not a bad assertion. `libchromaprint-tools` provides fpcalc on
      # Ubuntu; the runtime image uses Alpine's `chromaprint` for the same binary.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools

      # The suite runs against a MIGRATED database — `src/test/postgres.ts` opens
      # the schema, it does not create it. `DATABASE_URL` here, not
      # `TEST_DATABASE_URL`: the migrator always reads the former, the same
      # variable it reads in every other environment, while the latter is only
      # the name the suite falls back to. `--phase=all` because CI's database is
      # empty every run, with no live image to protect — the same call
      # `quality.yml` makes, deliberately identical so the two cannot disagree
      # about what the suite is tested against.
      - name: Migrate Postgres (CI service)
        working-directory: packages/backend
        run: bun run db:migrate --phase=all --target-database=syra_ci
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: cd packages/backend && bun run test

      - run: cd packages/frontend && bunx jest --ci

      # i18n key integrity. tsc cannot see this: i18next renders the raw key when it
      # cannot resolve one, so a renamed key ships as dotted identifiers on screen in
      # every language rather than failing anything.
      - run: cd packages/frontend && bun run check-i18n

  deploy:
    needs: test
    # workflow_dispatch can be run against arbitrary refs; only deploys from the
    # protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main'
    # ARM, so buildx builds the linux/arm64 image NATIVELY. Do not "fix" this by
    # moving to x86 + `docker/setup-qemu-action`: emulated arm64 builds are far
    # slower, and the outage that change was meant to answer had a different
    # cause entirely.
    #
    # THE STORY THAT SAYS OTHERWISE IS WRONG, and it is written down here so it
    # is not re-derived. Through 2026-08-08 every run of this workflow completed
    # as `action_required` with ZERO jobs, which was attributed to this
    # partner-runner label. It is not the label. GitHub's run page states the
    # actual reason: "GitHub detected that this workflow file may be malicious.
    # It will not run until someone with write access approves it." Two
    # measurements settle it — a dispatch of THIS workflow with both jobs on
    # `ubuntu-latest` was blocked identically (run 31278743099, zero jobs), and
    # Mercaria's first green deploy (run 31275312983) was created at 19:47:43Z,
    # started at 20:05:05Z once approved, and ran its deploy job on THIS LABEL,
    # three minutes before the commit that moved it to QEMU. The label works; the
    # run needs a human to approve it.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # An EXPLICIT allowlist — never `toJSON(secrets)`.
      #
      # This step used to enumerate every secret the repo can see and pipe the
      # lot through `jq` into `aws ssm put-parameter`. That shape is
      # indistinguishable from a secret-exfiltration payload, and it is what
      # GitHub's malicious-workflow detection was matching — the block recorded
      # on `deploy`'s `runs-on` below, where every run was created as
      # `action_required` with ZERO jobs until a human pressed "Approve and run".
      # Measured across the org on 2026-08-08: the three repos whose deploy
      # workflow contained `toJSON(secrets)` (Syra, Mercaria, Homiio) were all
      # held, and the two without it (Mention, OxyHQServices) deployed unheld.
      # The gate re-fires whenever the workflow file changes, which is what made
      # it look like a runner-label problem in the first place.
      #
      # So the allowlist is not tidiness: it is the property that keeps
      # automated deploys running at all. `src/db/__tests__/deployWorkflow.test.ts`
      # fails if `toJSON(secrets)` comes back.
      #
      # The SYNC_ prefix is load-bearing for a second, unrelated reason, and this
      # repo is where it actually bites: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      # are real secrets here, and the OIDC step above exports those same two
      # names into the job environment. Binding them under their raw names would
      # shadow the assumed role and fail this step with
      # UnrecognizedClientException. The old loop never bound a secret to an env
      # var at all — values moved through `jq` into the loop variables — which is
      # how it sidestepped that; an allowlist has to avoid it deliberately. Same
      # reason oxy-api's sync step carries the prefix.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          SYNC_ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          SYNC_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SYNC_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SYNC_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SYNC_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SYNC_REDIS_URL: ${{ secrets.REDIS_URL }}
          SYNC_STREAM_TOKEN_SECRET: ${{ secrets.STREAM_TOKEN_SECRET }}
        run: |
          # Derived from the LIVE task definition (oxy-syra:8, the revision
          # service `syra` runs), not from a plan: these are the parameters the
          # container actually reads as `secrets`.
          SHARED_SECRETS="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY REDIS_URL"
          # DATABASE_URL is NOT in that task definition yet, and must be here
          # anyway: the deploy step below names
          # /oxy/syra/DATABASE_URL in TASK_SECRET_OVERRIDES_JSON, so every
          # revision this workflow registers reads it — and a task launched from
          # a revision naming a parameter that does not exist dies with
          # `ResourceInitializationError: unable to pull secrets or registry
          # auth`. This step is what puts it there, on the same run, before that
          # step. Dropping it from this list breaks the Mongo->Postgres cutover.
          APP_SECRETS="ACOUSTID_API_KEY DATABASE_URL JWT_SECRET MONGODB_URI STREAM_TOKEN_SECRET"

          # LIVEKIT_API_KEY and LIVEKIT_API_SECRET are deliberately absent,
          # though oxy-syra:8 reads both from /oxy/_shared/. Syra CONSUMES those
          # two; it does not own them — OxyHQServices holds them as secrets and
          # is what writes them. This repo holds neither, so leaving them out
          # stops nothing that was being synced, and a value added here later
          # would otherwise overwrite the shared credential oxy-api reads.
          for k in $SHARED_SECRETS $APP_SECRETS; do
            v=$(printenv "SYNC_$k" || true)
            # A secret left empty, or set to a single dash, is a mistake — not an
            # instruction to overwrite production with garbage. Skipping the sync
            # preserves whatever SSM already holds.
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED_SECRETS " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            aws ssm put-parameter --name "$path" --value "$v" --type SecureString --overwrite >/dev/null && echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # --metadata-file is the only addition to this build: the digest comes
          # out of the build itself. Resolving it afterwards with
          # `aws ecr describe-images` is not an option here: oxy-github-deploy
          # has no ecr:DescribeImages, confirmed with
          # `aws iam simulate-principal-policy` (implicitDeny), so that call
          # fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      # ── Which migrations bracket this rollout ────────────────────────────────
      #
      # Exactly one of the next two steps runs — their conditions are
      # complements of the same expression — and each writes the pair of one-shot
      # commands `deploy-ecs-image.sh` consumes into $GITHUB_ENV. That is what
      # makes `all` and `post` mutually exclusive: not a convention, but the fact
      # that no run can execute both selectors, so no run can produce both
      # commands. `src/db/__tests__/deployWorkflow.test.ts` reads this file and
      # fails if the conditions stop being complements.
      #
      # `node`, not `bun`: the runtime stage of packages/backend/Dockerfile is
      # node:22-alpine and never copies bun in.
      # `dist/src/db/migrate.js`: tsconfig sets `rootDir: "./"`, so `src/` is
      # preserved inside `dist/`.
      # `--target-database=syra`: the migrator refuses to run without it, because
      # a migration aimed at the wrong database does not fail — it reports
      # success over an untouched one.

      # THE CUTOVER, chosen by hand from workflow_dispatch, and never the
      # default. THE FIRST PRODUCTION DEPLOY CANNOT USE `--phase=pre`. Measured
      # against the journal as it stands: `pre` and `post` both BLOCK, because
      # migration 0003 (`pre`) sits behind 0001 (`post`) and the ledger cannot
      # express a hole. That is the genesis window — those migrations only ever
      # ran against an empty database with no live predecessor to protect — and
      # `--phase=all` is the correct and only sanctioned way to apply it. See
      # src/db/migrate.ts, "THE GENESIS BOOTSTRAP WINDOW".
      #
      # The post-deploy command is deliberately EMPTY, which is how
      # deploy-ecs-image.sh is told to skip that task: the `all` run above it has
      # already applied everything, so a `post` task could only find nothing
      # pending and add a way for a green cutover to end on a red step.
      - name: Select migrations (cutover — the whole journal, before the rollout)
        if: github.event.inputs.migration_phase == 'all'
        run: |
          {
            echo 'PRE_DEPLOY_TASK_COMMAND_JSON=["node","packages/backend/dist/src/db/migrate.js","--phase=all","--target-database=syra"]'
            echo 'POST_DEPLOY_TASK_COMMAND_JSON='
          } >>"$GITHUB_ENV"

      # Every ordinary release. `pre` runs while the PREVIOUS image is still
      # serving and applies only additive migrations; `post` runs once the new
      # image is live and applies what `pre` deferred. src/db/migrate.ts explains
      # the marker each migration carries and why there is no default phase.
      - name: Select migrations (default — additive before, deferred after)
        if: github.event.inputs.migration_phase != 'all'
        run: |
          {
            echo 'PRE_DEPLOY_TASK_COMMAND_JSON=["node","packages/backend/dist/src/db/migrate.js","--phase=pre","--target-database=syra"]'
            echo 'POST_DEPLOY_TASK_COMMAND_JSON=["node","packages/backend/dist/src/db/migrate.js","--phase=post","--target-database=syra"]'
          } >>"$GITHUB_ENV"

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}

          # DATABASE_URL is injected into every revision this deploy registers.
          #
          # It cannot come from Terraform. `modules/app-service` in oxy-infra
          # sets `ignore_changes = [task_definition]` on the ECS service, and
          # deploy-ecs-image.sh derives each new revision from the revision
          # currently RUNNING — so a `secrets` entry added to `module "syra"`
          # lands in a revision nothing runs and nothing inherits, indefinitely
          # and with no error. The entry is still there (it declares intent, and
          # a from-scratch apply needs it); THIS is what puts the value in front
          # of the service. Same mechanism Mention uses for its own
          # deploy-injected secrets.
          #
          # It is also what gives the one-shot migration tasks this step runs
          # their connection string: each runs as a container override on the
          # revision this deploy registers, so they see exactly these secrets.
          #
          # The parameter must EXIST before the first task launches from a
          # revision naming it, or the task dies with
          # `ResourceInitializationError: unable to pull secrets or registry
          # auth`. The sync step above writes it from the GitHub repo secret on
          # this same run, before this step — but ONLY because DATABASE_URL is on
          # that step's allowlist. It is an allowlist you CAN forget: adding a
          # repo secret no longer reaches SSM by itself, and adding one here
          # without adding it there registers a revision naming a parameter that
          # does not exist, which fails at task launch rather than at deploy.
          # The sync step used to walk `toJSON(secrets)` instead, which needed no
          # workflow edit — and which is exactly what got every run of this
          # workflow held for approval. See the note on that step.
          TASK_SECRET_OVERRIDES_JSON: '{"DATABASE_URL":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/syra/DATABASE_URL"}'

          # PRE_DEPLOY_TASK_COMMAND_JSON / POST_DEPLOY_TASK_COMMAND_JSON are NOT
          # set here: whichever selector step above ran put them in $GITHUB_ENV,
          # so the pair this step sees is the one the chosen `migration_phase`
          # produced. The script reads an empty POST value as "no post task".
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh
