# On-demand one-off backend scripts (backfills, maintenance jobs) against the
# CURRENTLY DEPLOYED production image — no build, no new task definition, no
# service update. Manually triggered only; never runs on a push.
#
# `script` is a closed allowlist, not a free-text command: workflow_dispatch
# already requires write access to trigger, but this still runs with write
# access to the production database, so the blast radius of a mistake is
# capped at "one of these scripts, with these flags" rather than "any argv
# this trigger's caller can type."
name: Run Backend Script

on:
  workflow_dispatch:
    inputs:
      script:
        description: One-off backend script to run, as the image currently live in production.
        type: choice
        required: true
        options:
          - backfill-episode-images
          - backfill-fingerprints
          - backfill-track-audio-keys
          - backfill-podcast-covers
          - migrate-images-to-oxy
          - migrate-alia-covers
          - retire-legacy-image-storage
          - migrate-audio-to-oxy
          - retire-legacy-audio-ladders
      args:
        description: >-
          Optional flags, space-separated. Only --dry-run, --apply, --limit <n>
          and --concurrency <n> are accepted; anything else is refused.
          --concurrency affects backfill-episode-images, backfill-podcast-covers
          migrate-images-to-oxy and migrate-audio-to-oxy (default 4; the other
          scripts ignore it). The five Oxy Files scripts PREVIEW unless given
          --apply (docs/runbooks/oxy-files-images.md,
          docs/runbooks/oxy-files-audio.md); --limit bounds their units.
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  # Shares deploy-aws.yml's group deliberately: both read/act on the same ECS
  # service and task definition via the same AWS role, and a real deploy
  # racing this (or two of these racing each other) is exactly the
  # describe-then-act hazard that workflow's group exists to serialize away.
  group: deploy-syra-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  APP: syra

jobs:
  run-script:
    runs-on: ubuntu-latest
    # run-one-shot-ecs-task.sh waits up to MAX_WAIT_SECS (3600) for the task to
    # stop; this only stops a hang holding a runner for the 6-hour default.
    timeout-minutes: 75
    # workflow_dispatch runs the workflow FILE AS IT EXISTS on whatever ref is
    # selected, not necessarily main — so without this, dispatching against a
    # branch that has edited run-one-shot-ecs-task.sh would still assume the
    # real AWS deploy role and run whatever that edited script says. Same
    # belt-and-suspenders gate deploy-aws.yml's `deploy` job uses for the same
    # reason, restated here rather than trusted to the OIDC trust policy alone.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Refused as text (not shell-interpolated — `command` below is built with
      # `jq --arg`), but still validated as a defense-in-depth boundary: this
      # is the one place a typo in the dispatch form could otherwise smuggle an
      # unintended flag through to a script with write access to production.
      - name: Validate args against the allowlist
        id: args
        env:
          RAW_ARGS: ${{ inputs.args }}
        run: |
          flag='(--dry-run|--apply|--limit\ [0-9]+|--concurrency\ [0-9]+)'
          if [[ -n "$RAW_ARGS" && ! "$RAW_ARGS" =~ ^$flag([[:space:]]$flag)*$ ]]; then
            echo "::error::args must be some combination of --dry-run, --apply, --limit <n> and --concurrency <n> only, got: $RAW_ARGS"
            exit 1
          fi
          json="$(jq -cn --arg a "$RAW_ARGS" '($a | select(length > 0) | split(" ")) // []')"
          echo "json=$json" >>"$GITHUB_OUTPUT"

      # The compiled entry point each choice maps to. `tsconfig.build.json` sets
      # rootDir "./", so `src/scripts/<name>.ts` compiles to
      # `dist/src/scripts/<name>.js` — the same layout deploy-aws.yml's own
      # migration one-shot command relies on for `src/db/migrate.ts`.
      - name: Resolve the script's compiled entry point
        id: script
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in
            backfill-episode-images) path="packages/backend/dist/src/scripts/backfillEpisodeImages.js" ;;
            backfill-fingerprints) path="packages/backend/dist/src/scripts/backfillTrackFingerprints.js" ;;
            backfill-track-audio-keys) path="packages/backend/dist/src/scripts/backfillTrackAudioKeys.js" ;;
            backfill-podcast-covers) path="packages/backend/dist/src/scripts/backfillPodcastCovers.js" ;;
            migrate-images-to-oxy) path="packages/backend/dist/src/scripts/migrateImagesToOxy.js" ;;
            migrate-alia-covers) path="packages/backend/dist/src/scripts/migrateAliaCovers.js" ;;
            retire-legacy-image-storage) path="packages/backend/dist/src/scripts/retireLegacyImageStorage.js" ;;
            migrate-audio-to-oxy) path="packages/backend/dist/src/scripts/migrateAudioToOxy.js" ;;
            retire-legacy-audio-ladders) path="packages/backend/dist/src/scripts/retireLegacyAudioLadders.js" ;;
            *) echo "::error::unknown script: $SCRIPT"; exit 1 ;;
          esac
          echo "path=$path" >>"$GITHUB_OUTPUT"

      # `bun`: the runtime the deployed image ships (packages/backend/Dockerfile).
      # This runs against the image LIVE in production, not one this workflow
      # builds; the deploy that ships a Bun image is what makes `bun` valid here.
      - name: Run as a one-off ECS task
        env:
          COMMAND_JSON: ${{ format('["bun","{0}"]', steps.script.outputs.path) }}
          ARGS_JSON: ${{ steps.args.outputs.json }}
          SCRIPT_NAME: ${{ inputs.script }}
          SCRIPT_ARGS: ${{ inputs.args }}
        run: |
          command_json="$(jq -c --argjson extra "$ARGS_JSON" '. + $extra' <<<"$COMMAND_JSON")"
          echo "Running $SCRIPT_NAME $SCRIPT_ARGS"
          COMMAND_JSON="$command_json" bash .github/scripts/run-one-shot-ecs-task.sh
