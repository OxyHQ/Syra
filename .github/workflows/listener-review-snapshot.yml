name: Listener review source snapshot
on:
  push:
    branches: [feat/listener-experience-140]
    paths: [.github/workflows/listener-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract the PostgreSQL test runtime from the official image
        run: |
          docker pull postgres:17-bookworm
          id=$(docker create postgres:17-bookworm)
          mkdir -p pg-runtime/usr/lib pg-runtime/usr/share pg-runtime/lib
          docker cp "$id:/usr/lib/postgresql" pg-runtime/usr/lib/postgresql
          docker cp "$id:/usr/share/postgresql" pg-runtime/usr/share/postgresql
          docker cp "$id:/usr/lib/x86_64-linux-gnu" pg-runtime/lib/x86_64-linux-gnu
          docker rm "$id"
          tar -czf syra-postgres-test-runtime.tar.gz pg-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: listener-review-postgres
          path: syra-postgres-test-runtime.tar.gz
          compression-level: 0
          retention-days: 1
