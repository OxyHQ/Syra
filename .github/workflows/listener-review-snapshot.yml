name: Listener review source snapshot
on:
  push:
    branches: [feat/listener-experience-140]
    paths: [.github/workflows/listener-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run build:sdk
      - name: Archive test dependencies without credentials
        run: |
          mkdir -p .review-tools
          cp "$(command -v bun)" .review-tools/bun
          find packages -mindepth 2 -maxdepth 2 -type d -name node_modules > /tmp/syra-dependencies.txt
          printf '%s\n' node_modules packages/shared-types/dist packages/sdk/lib .review-tools >> /tmp/syra-dependencies.txt
          tar -czf syra-test-dependencies.tar.gz -T /tmp/syra-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: listener-review-dependencies
          path: syra-test-dependencies.tar.gz
          compression-level: 0
          retention-days: 1
