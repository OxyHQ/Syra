name: Listener review source snapshot
on:
  push:
    branches: [feat/listener-experience-140]
    paths: [.github/workflows/listener-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bc06f78fc1de10288560a768e8461cea7a9f8570
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar --output=syra-current-main.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: syra-current-main
          path: syra-current-main.tar
          retention-days: 1
