name: Listener review source snapshot
on:
  push:
    branches: [feat/listener-experience-140]
    paths: [.github/workflows/listener-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar --output=syra-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: listener-review-source
          path: syra-source.tar
          retention-days: 1
