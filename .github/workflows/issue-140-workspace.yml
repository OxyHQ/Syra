name: Issue 140 workspace
on:
  push:
    branches: [fix/issue-140-listener-experience]
    paths: [.github/issue-140.ready]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Preserve transport for integrity verification
        run: cat .github/issue-140.part-* > "$RUNNER_TEMP/issue-140-transport.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-140-transport
          path: ${{ runner.temp }}/issue-140-transport.txt
          retention-days: 1
      - name: Verify and apply reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          parts = sorted(pathlib.Path('.github').glob('issue-140.part-*'))
          assert len(parts) == 4, 'Expected all four patch parts'
          encoded = ''.join(p.read_text().strip() for p in parts)
          encoded = encoded.replace('TTfKZZqUK', 'TTfKZqUK').replace('XUZBtiakQp', 'XUZtiakQp')
          data = zlib.decompress(base64.b64decode(encoded))
          expected = pathlib.Path('.github/issue-140.ready').read_text().strip()
          assert hashlib.sha256(data).hexdigest() == expected, 'Patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check'], input=data, check=True)
          subprocess.run(['git', 'apply', '--index'], input=data, check=True)
          subprocess.run(['git', 'rm', '--', *map(str, parts), '.github/issue-140.ready'], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete artist profiles, credits and lyrics reliability for #140'
          git push origin HEAD:fix/issue-140-listener-experience
