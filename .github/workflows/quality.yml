name: Quality

# Typecheck + lint every workspace on every change. The deploy workflows are
# path-filtered (backend deploys on backend changes, etc.), so a change confined
# to @syra.fm/sdk or @syra/shared-types — both consumed by all the apps — would
# otherwise reach main with no type coverage at all. This job is deliberately
# NOT path-filtered so that never happens.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the rollout logic deploy-aws.yml runs against production. The script
  # and this harness are byte-identical copies of Mention's, so they share its
  # test rather than growing a second, drifting one. Separate job: it needs no
  # bun install and no workspace build, so it should not queue behind them.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh

  quality:
    runs-on: ubuntu-latest
    # `postgres:17`, not a PostGIS image — see `src/db/extensions.ts`:
    # `REQUIRED_EXTENSIONS` is deliberately empty, Syra has no `2dsphere`
    # index and no geospatial query to port, and `docker-compose.postgres.yml`
    # pins the SAME image so a developer's database and CI's cannot disagree
    # about what is installed. Keep this bare: nothing in Syra should acquire
    # an extension dependency by accident, and this image is the thing that
    # would let it — a schema task that starts needing PostGIS or any other
    # extension adds it to `REQUIRED_EXTENSIONS` first, and only then here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syra
          POSTGRES_PASSWORD: syra
          POSTGRES_DB: syra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syra -d syra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://syra:syra@127.0.0.1:5432/syra_ci
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile

      # Before the builds and typechecks, and needing neither: it reads the tracked
      # file listing. Syra went to Postgres greenfield in #92 and `syra-production`
      # was dropped on 2026-08-09, so a Mongo reference is now always a mistake —
      # and it would arrive as a hoisted dependency or a stray env name, neither of
      # which breaks a build.
      - name: Guard against MongoDB returning
        run: bun run validate:no-mongo

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever, and it grows by accretion — one reasonable paragraph
      # at a time, invisible per-commit. Nothing breaks when it grows, which is
      # why a gate rather than a convention. Reads the tracked file listing only.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md

      # shared-types and the SDK are consumed as built output (dist/lib) by the
      # apps, so their typechecks — and the apps' — need them built first, same
      # order the deploy workflows use.
      - run: bun run build:shared-types
      - run: bun run build:sdk
      - name: Typecheck all packages
        run: bun run --filter '*' typecheck
      # Lint only the packages that carry an eslint config today (frontend,
      # studio). `expo lint` exits non-zero only on errors, not warnings, so this
      # gates real breakage without failing on the existing warning backlog.
      # backend / sdk / shared-types have no eslint config yet — adding one is a
      # separate change so this gate can land without a lint-fix sweep.
      - name: Lint
        run: |
          cd packages/frontend && bun run lint
          cd ../studio && bun run lint
      # The backend suite was not run by ANY workflow before this: quality
      # typechecked and linted, and the deploy workflows only build. A guard that
      # no job executes is a comment — the moderation integration's invariants
      # (the intake transaction commits both writes or neither; the webhook
      # receiver refuses a parsed body) are enforced only by these tests, and
      # they run against a real Postgres rather than a mock, which is what makes
      # them worth gating on: a mocked `insert` that rejects leaves no aborted
      # transaction behind, so a unique-violation recovery path passes in the
      # test and fails against a server.
      #
      # (This said "a real in-memory MongoDB replica set" until the Postgres
      # cutover finished. Syra opens no Mongo anywhere: the live task definition
      # carries DATABASE_URL and no MONGODB_URI, /health reports
      # engine=postgres, and no package.json here declares mongoose. The
      # mongoose in node_modules is an OPTIONAL peer of @oxyhq/crowdsource-app
      # that nothing satisfies.)
      # The upload screening suite shells out to real binaries rather than mocking
      # them: ffprobe measures a fixture's true duration/codec, ffmpeg builds the
      # fixtures and drives the HLS packager, and fpcalc produces the Chromaprint
      # fingerprints the dedup tiers match on. Without them 43 tests fail in under
      # a millisecond each — the signature of a missing executable, not a bad
      # assertion. `chromaprint` is the package that provides fpcalc (the Debian
      # name `libchromaprint-tools` is a different distribution's).
      - name: Install audio toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools

      # Schema-vs-migration drift gate (Task 4 review, Critical #2): every
      # DB-backed test below runs against the already-MIGRATED database,
      # which does not move when a `schema/*.ts` file changes. A committed
      # schema edit with no matching migration was invisible to every other
      # step in this workflow — `db:generate` reporting "no schema changes"
      # was a line in an implementer's report, not a gate, until this step.
      # It catches THAT gap only: `drizzle-kit generate` diffs the current
      # `schema/*.ts` against the latest recorded snapshot, so it reports
      # nothing to do whenever they already agree — it does not re-read an
      # already-generated migration's SQL and re-verify it against its own
      # snapshot, so a migration file hand-edited after generation (schema
      # and snapshot left untouched) produces no diff here and is not caught
      # by this step. `drizzle-kit generate` never opens a database
      # connection (verified directly: it succeeds identically against an
      # unreachable `DATABASE_URL`) — only `drizzle.config.ts`'s own guard
      # requires the variable to be SET, so this can run before Postgres is
      # migrated, or even before it is reachable.
      - name: Check schema/migration drift
        working-directory: packages/backend
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::db:generate produced changes under drizzle/ that are not committed. A schema/*.ts edit landed without its matching migration. Run 'bun run db:generate' locally, inspect the SQL, and commit the result in the same change as the schema edit." >&2
            git status --porcelain -- drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # `src/db/__tests__/gates.test.ts`'s schema-invariant and expiry-index
      # gates only need a live, reachable Postgres to pass Task 1's floors
      # (`minimumTables`/`minimumColumns` at 0, `EXPIRY_SWEEP_TARGETS` empty)
      # — migrating first is not required for THEM. This step exists anyway
      # because it is the thing Step 10 of the plan actually asks to be
      # proven: that the real migrator, pointed at a fresh service database
      # with a genuinely empty journal, succeeds and applies nothing.
      # `DATABASE_URL` here (not `TEST_DATABASE_URL`): the migrator always
      # reads `DATABASE_URL`, the same variable it reads in every other
      # environment; `TEST_DATABASE_URL` is only the job-level name the test
      # suite falls back to (see gates.test.ts's `beforeAll`).
      - name: Migrate Postgres (CI service)
        working-directory: packages/backend
        run: bun run db:migrate --phase=all --target-database=syra_ci
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # 25 suites, 213 assertions, under two seconds — and until now CI ran none
      # of them, so every claim the listener app made about itself was
      # unfalsifiable here. The library sidebar bug this workflow change ships
      # alongside is exactly the kind a frontend test catches and a backend one
      # cannot: the data was there and the component refused to render it.
      - name: Frontend tests
        run: bun run --filter @syra/frontend test

      # The studio suite ran, but never on a PULL REQUEST. `deploy-studio.yml`
      # has a `Test studio` step, and this workflow is the only one with a
      # `pull_request` trigger at all — so the studio's tests could only ever
      # fail AFTER a merge, and only when the push's paths matched that
      # workflow's filter. A path miss skips the job, and a skipped job reports
      # its workflow green. The creator portal is where an owner destroys a
      # show, so its confirm-then-delete tests have to be able to fail while the
      # change is still a proposal.
      - name: Studio tests
        run: bun run --filter @syra/studio test

      - name: Guard bundle imports
        run: bun run check:bundle-imports

      - name: Export listener frontend
        run: bun run build:frontend

      - name: Enforce web bundle budget
        run: bun run check:web-bundle-budget

      - name: Mutation-test performance gates
        run: bun run test:performance-gates

      - name: Backend tests
        run: bun run --filter @syra/backend test
