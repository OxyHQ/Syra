name: Quality

# Typecheck + lint every workspace on every change. The deploy workflows are
# path-filtered (backend deploys on backend changes, etc.), so a change confined
# to @syra.fm/sdk or @syra/shared-types — both consumed by all the apps — would
# otherwise reach main with no type coverage at all. This job is deliberately
# NOT path-filtered so that never happens.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the rollout logic deploy-aws.yml runs against production. The script
  # and this harness are byte-identical copies of Mention's, so they share its
  # test rather than growing a second, drifting one. Separate job: it needs no
  # bun install and no workspace build, so it should not queue behind them.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh

  quality:
    runs-on: ubuntu-latest
    # `postgres:17`, not a PostGIS image — see `src/db/extensions.ts`:
    # `REQUIRED_EXTENSIONS` is deliberately empty, Syra has no `2dsphere`
    # index and no geospatial query to port, and `docker-compose.postgres.yml`
    # pins the SAME image so a developer's database and CI's cannot disagree
    # about what is installed.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syra
          POSTGRES_PASSWORD: syra
          POSTGRES_DB: syra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syra -d syra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://syra:syra@127.0.0.1:5432/syra_ci
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      # shared-types and the SDK are consumed as built output (dist/lib) by the
      # apps, so their typechecks — and the apps' — need them built first, same
      # order the deploy workflows use.
      - run: bun run build:shared-types
      - run: bun run build:sdk
      - name: Typecheck all packages
        run: bun run --filter '*' typecheck
      # Lint only the packages that carry an eslint config today (frontend,
      # studio). `expo lint` exits non-zero only on errors, not warnings, so this
      # gates real breakage without failing on the existing warning backlog.
      # backend / sdk / shared-types have no eslint config yet — adding one is a
      # separate change so this gate can land without a lint-fix sweep.
      - name: Lint
        run: |
          cd packages/frontend && bun run lint
          cd ../studio && bun run lint
      # The backend suite was not run by ANY workflow before this: quality
      # typechecked and linted, and the deploy workflows only build. A guard that
      # no job executes is a comment — the moderation integration's invariants
      # (the intake transaction commits both writes or neither; the webhook
      # receiver refuses a parsed body) are enforced only by these tests, and
      # they run against a real in-memory MongoDB replica set rather than a mock,
      # which is what makes them worth gating on.
      # The upload screening suite shells out to real binaries rather than mocking
      # them: ffprobe measures a fixture's true duration/codec, ffmpeg builds the
      # fixtures and drives the HLS packager, and fpcalc produces the Chromaprint
      # fingerprints the dedup tiers match on. Without them 43 tests fail in under
      # a millisecond each — the signature of a missing executable, not a bad
      # assertion. `chromaprint` is the package that provides fpcalc (the Debian
      # name `libchromaprint-tools` is a different distribution's).
      - name: Install audio toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools

      # No `db:migrate` step yet: `src/db/__tests__/gates.test.ts`'s
      # schema-invariant and expiry-index gates only need a live, reachable
      # Postgres — their floors (`minimumTables`/`minimumColumns` at 0,
      # `EXPIRY_SWEEP_TARGETS` empty) hold against the service container
      # whether or not anything has ever been migrated onto it, verified
      # directly against a Postgres with no `drizzle` schema at all. A real
      # `bun run db:migrate` run against this service is added once
      # `@oxyhq/db@0.1.2` ships the `readJournal` fix tracked in
      # task-1-report.md — running it against 0.1.1 would fail today for a
      # reason that has nothing to do with this schema.
      - name: Backend tests
        run: bun run --filter @syra/backend test
