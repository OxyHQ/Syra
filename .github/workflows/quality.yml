name: Quality

# Typecheck + lint every workspace on every change. The deploy workflows are
# path-filtered (backend deploys on backend changes, etc.), so a change confined
# to @syra.fm/sdk or @syra/shared-types — both consumed by all the apps — would
# otherwise reach main with no type coverage at all. This job is deliberately
# NOT path-filtered so that never happens.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests skip the two side jobs whose inputs they do not touch: the
  # org shares one 20-job Actions concurrency cap across every repository, and
  # Backend Image Smoke holds an arm64 runner for up to 45 minutes. Anything
  # that is not a pull request (push to main) skips THIS job, and a skipped
  # `changes` makes both run, so main always gets the full set. A `changes`
  # that fails also makes both run rather than skip. `quality` (the required
  # check) never depends on it and always runs.
  changes:
    name: Detect affected inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      deploy-scripts: ${{ steps.filter.outputs.deploy-scripts }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # What packages/backend/Dockerfile copies (root manifests, every
            # workspace package.json, shared-types, the SDK, the backend), the
            # .dockerignore files, the reviewed-image pin and smoke harness
            # under .github/scripts, and this workflow.
            image:
              - 'packages/backend/**'
              - 'packages/shared-types/**'
              - 'packages/sdk/**'
              - 'packages/*/package.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - '**/.dockerignore'
              - '**/*.dockerignore'
              - '.github/scripts/**'
              - '.github/workflows/quality.yml'
            # The release scripts and their harnesses, the workflow they read
            # their commands and scope from, and the migrator entry point
            # test-deploy-ecs-image.sh checks exists.
            deploy-scripts:
              - '.github/scripts/**'
              - '.github/workflows/deploy-aws.yml'
              - '.github/workflows/quality.yml'
              - 'packages/backend/src/db/**'
              - 'packages/backend/package.json'
              - 'packages/backend/tsconfig*.json'

  # Gates the rollout logic deploy-aws.yml runs against production. The script
  # and this harness are byte-identical copies of Mention's, so they share its
  # test rather than growing a second, drifting one. Separate job: it needs no
  # bun install and no workspace build, so it should not queue behind them.
  deploy-script-test:
    name: Deploy Script Tests
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' || needs.changes.outputs.deploy-scripts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-run-one-shot-ecs-task.sh
          bash .github/scripts/test-deploy-scope.sh

  # The backend image as ECS runs it. Production runs the backend on Bun
  # (packages/backend/Dockerfile's runner stage is oven/bun:1.4.3-alpine), and
  # what that depends on is a property of the IMAGE, not of this runner: sharp's
  # musl prebuild, require() of the ESM-only livekit-server-sdk, firebase-admin's
  # gRPC stack, the apk ffmpeg/chromaprint and the Bento4 binaries, dumb-init
  # forwarding SIGTERM, and a failed boot exiting non-zero.
  # .github/scripts/smoke-backend-image.sh boots the built image against the
  # throwaway Postgres below and asserts all of it.
  #
  # arm64, natively, because production is linux/arm64 (deploy-aws.yml) and
  # sharp/Bento4 are per-architecture. It READS the deploy's buildx cache scope
  # and writes none: only main-branch workflows write a scope (see
  # refresh-build-cache.yml).
  backend-image-smoke:
    name: Backend Image Smoke
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syra
          POSTGRES_PASSWORD: syra
          # `syra`: the migrator's --target-database, as the deploy passes it.
          POSTGRES_DB: syra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syra -d syra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `--cache-from type=gha` needs the Actions runtime token and cache URL,
      # which GitHub gives to JavaScript actions and NOT to `run:` steps.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # The same guard deploy-aws.yml runs before its build, so this smoke
      # builds exactly the Dockerfile and context production would.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe syra

      - name: Build the backend image (linux/arm64)
        env:
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=syra-backend \
            -f "$DOCKERFILE" \
            -t syra-backend:ci \
            --load \
            "$CONTEXT"

      - name: Smoke the backend image under its Bun runtime
        env:
          IMAGE: syra-backend:ci
          DATABASE_URL: postgres://syra:syra@127.0.0.1:5432/syra
        run: |
          EXPECTED_BUN_VERSION="$(jq -r '.packageManager | sub("^bun@"; "")' package.json)"
          export EXPECTED_BUN_VERSION
          bash .github/scripts/smoke-backend-image.sh

  quality:
    runs-on: ubuntu-latest
    # About 8 minutes warm; the bound only stops a hang holding a runner for
    # GitHub's 6-hour default.
    timeout-minutes: 40
    # `postgres:17`, not a PostGIS image — see `src/db/extensions.ts`:
    # `REQUIRED_EXTENSIONS` is deliberately empty, Syra has no `2dsphere`
    # index and no geospatial query to port, and `docker-compose.postgres.yml`
    # pins the SAME image so a developer's database and CI's cannot disagree
    # about what is installed. Keep this bare: nothing in Syra should acquire
    # an extension dependency by accident, and this image is the thing that
    # would let it — a schema task that starts needing PostGIS or any other
    # extension adds it to `REQUIRED_EXTENSIONS` first, and only then here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syra
          POSTGRES_PASSWORD: syra
          POSTGRES_DB: syra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syra -d syra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://syra:syra@127.0.0.1:5432/syra_ci
    steps:
      - uses: actions/checkout@v7
      # Expo SDK 58's CLI (expo lint, jest-expo, expo export) needs Node
      # 22.13+; the runner's default Node is not guaranteed to be that. Same
      # pin as deploy-frontends.yml / deploy-studio.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          # The one pin is package.json's `packageManager`; check:bun-pin holds
          # the backend image's literal oven/bun tag to it.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Check Oxy dependency health
        run: bun run doctor:oxy

      # Syra never owns inference-provider credentials or talks to a model
      # provider/Kaana directly. One-shot product AI belongs behind the Oxy
      # inference edge through @oxy.so/core; conversations and agents belong in
      # Alia. Metadata providers (MusicBrainz, AcoustID, LRCLIB, Podcast Index,
      # etc.) are intentionally outside this rule and remain Syra integrations.
      - name: Guard canonical AI routing
        run: bun run validate:ai-architecture

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever, and it grows by accretion — one reasonable paragraph
      # at a time, invisible per-commit. Nothing breaks when it grows, which is
      # why a gate rather than a convention. Reads the tracked file listing only.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md

      # Every workflow reads bun from `packageManager`, but the backend image's
      # `COPY --from=oven/bun:<tag>` is a literal. A bump that missed it would
      # build the image with a bun that neither wrote bun.lock nor ran CI.
      - name: Guard the bun pin
        run: bun run check:bun-pin

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. deploy-aws.yml refuses to build
      # on a mismatch, so catching it here is what stops a merge from
      # stranding main undeployable. The fixture tests run first so a green
      # check means the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

      # shared-types and the SDK are consumed as built output (dist/lib) by the
      # apps, so their typechecks — and the apps' — need them built first, same
      # order the deploy workflows use.
      - run: bun run build:shared-types
      - run: bun run build:contracts
      - run: bun run build:sdk
      # packages/contracts/openapi.json is the published wire contract of the
      # public routes; it must be what the Zod contract generates.
      - run: bun run check:public-openapi
      - name: Typecheck all packages
        run: bun run --filter '*' typecheck
      # The SDK suite ran nowhere in CI: its live-rooms UI tests (the icon glyphs
      # hidden from screen readers, the Create Room sheet's inline failure) are
      # its only guard, and the SDK has no eslint config to catch a raw
      # @expo/vector-icons import instead.
      - name: SDK tests
        run: bun run --filter @syra.fm/sdk test
      - name: Built SDK with published Oxy transport
        run: |
          bun install --cwd tests/sdk-transport --frozen-lockfile --minimum-release-age=0
          bun run --cwd tests/sdk-transport typecheck
          bun run --cwd tests/sdk-transport test
      # Biome formats and lints EVERY package (root `biome.json`). `biome ci`
      # fails on formatting drift and on error-level rules, not on warnings, so
      # the baselined backlog (rules set to "warn" when Biome was adopted) does
      # not block while it is paid down.
      - name: Biome
        run: bunx biome ci .
      # The minimal ESLint left in the two Expo apps holds only what Biome has no
      # rule for (eslint-plugin-expo's EXPO_PUBLIC_* env-var rules and the React
      # Compiler rules). `expo lint` exits non-zero only on errors.
      - name: Lint (Expo ESLint remnants)
        run: |
          cd packages/frontend && bun run lint
          cd ../studio && bun run lint
      # The backend suite was not run by ANY workflow before this: quality
      # typechecked and linted, and the deploy workflows only build. A guard that
      # no job executes is a comment — the moderation integration's invariants
      # (the intake transaction commits both writes or neither; the webhook
      # receiver refuses a parsed body) are enforced only by these tests, and
      # they run against a real Postgres rather than a mock, which is what makes
      # them worth gating on: a mocked `insert` that rejects leaves no aborted
      # transaction behind, so a unique-violation recovery path passes in the
      # test and fails against a server.
      # The upload screening suite shells out to real binaries rather than mocking
      # them: ffprobe measures a fixture's true duration/codec, ffmpeg builds the
      # fixtures and drives the HLS packager, and fpcalc produces the Chromaprint
      # fingerprints the dedup tiers match on. Without them 43 tests fail in under
      # a millisecond each — the signature of a missing executable, not a bad
      # assertion. `chromaprint` is the package that provides fpcalc (the Debian
      # name `libchromaprint-tools` is a different distribution's).
      - name: Install audio toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools

      # Every Oxy app shares ONE Postgres, so a migration that holds an ACCESS
      # EXCLUSIVE lock on a table read per request while it backfills or builds
      # an index stalls every product on it (oxy, 2026-10-16). The rules are
      # oxy's MIGRATION-CONTRACT.md ("Every migration keeps its locks short"),
      # checked by @oxy.so/db's own gate for every migration after 0036; the
      # hot tables are the ones a listener's request reads. A reviewed
      # exception says why in its file: `-- oxy:lock-review=<reason>`.
      - name: Check migration locks
        working-directory: packages/backend
        run: bun run db:check-locks

      # Schema-vs-migration drift gate (Task 4 review, Critical #2): every
      # DB-backed test below runs against the already-MIGRATED database,
      # which does not move when a `schema/*.ts` file changes. A committed
      # schema edit with no matching migration was invisible to every other
      # step in this workflow — `db:generate` reporting "no schema changes"
      # was a line in an implementer's report, not a gate, until this step.
      # It catches THAT gap only: `drizzle-kit generate` diffs the current
      # `schema/*.ts` against the latest recorded snapshot, so it reports
      # nothing to do whenever they already agree — it does not re-read an
      # already-generated migration's SQL and re-verify it against its own
      # snapshot, so a migration file hand-edited after generation (schema
      # and snapshot left untouched) produces no diff here and is not caught
      # by this step. `drizzle-kit generate` never opens a database
      # connection (verified directly: it succeeds identically against an
      # unreachable `DATABASE_URL`) — only `drizzle.config.ts`'s own guard
      # requires the variable to be SET, so this can run before Postgres is
      # migrated, or even before it is reachable.
      - name: Check schema/migration drift
        working-directory: packages/backend
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::db:generate produced changes under drizzle/ that are not committed. A schema/*.ts edit landed without its matching migration. Run 'bun run db:generate' locally, inspect the SQL, and commit the result in the same change as the schema edit." >&2
            git status --porcelain -- drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # `src/db/__tests__/gates.test.ts`'s schema-invariant and expiry-index
      # gates only need a live, reachable Postgres to pass Task 1's floors
      # (`minimumTables`/`minimumColumns` at 0, `EXPIRY_SWEEP_TARGETS` empty)
      # — migrating first is not required for THEM. This step exists anyway
      # because it is the thing Step 10 of the plan actually asks to be
      # proven: that the real migrator, pointed at a fresh service database
      # with a genuinely empty journal, succeeds and applies nothing.
      # `DATABASE_URL` here (not `TEST_DATABASE_URL`): the migrator always
      # reads `DATABASE_URL`, the same variable it reads in every other
      # environment; `TEST_DATABASE_URL` is only the job-level name the test
      # suite falls back to (see gates.test.ts's `beforeAll`).
      - name: Migrate Postgres (CI service)
        working-directory: packages/backend
        run: bun run db:migrate --phase=all --target-database=syra_ci
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # 25 suites, 213 assertions, under two seconds — and until now CI ran none
      # of them, so every claim the listener app made about itself was
      # unfalsifiable here. The library sidebar bug this workflow change ships
      # alongside is exactly the kind a frontend test catches and a backend one
      # cannot: the data was there and the component refused to render it.
      - name: Frontend tests
        run: bun run --filter @syra/frontend test

      # The studio suite ran, but never on a PULL REQUEST. `deploy-studio.yml`
      # has a `Test studio` step, and this workflow is the only one with a
      # `pull_request` trigger at all — so the studio's tests could only ever
      # fail AFTER a merge, and only when the push's paths matched that
      # workflow's filter. A path miss skips the job, and a skipped job reports
      # its workflow green. The creator portal is where an owner destroys a
      # show, so its confirm-then-delete tests have to be able to fail while the
      # change is still a proposal.
      - name: Studio tests
        run: bun run --filter @syra/studio test

      # i18n key integrity. tsc cannot see this: i18next renders the raw key
      # when it cannot resolve one, so a renamed key ships as dotted identifiers
      # on screen in every language rather than failing anything. Moved here
      # from deploy-aws.yml's former `test` job, which was the only thing that
      # ran it on a push to main; deploy-frontends.yml still runs it too.
      - name: Check i18n keys
        run: cd packages/frontend && bun run check-i18n

      - name: Guard bundle imports
        run: bun run check:bundle-imports

      - name: Export listener frontend
        run: bun run build:frontend

      - name: Enforce web bundle budget
        run: bun run check:web-bundle-budget

      - name: Mutation-test performance gates
        run: bun run test:performance-gates

      - name: Backend tests
        run: bun run --filter @syra/backend test
